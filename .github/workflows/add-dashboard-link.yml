name: Add Research Dashboard Link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-dashboard-link:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add dashboard link if missing
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'href="dashboard.html"' not in s:
              marker = '</header>'
              link = '<a class="dashboard-link" href="dashboard.html" style="margin-left:auto;margin-right:14px;color:#fff;background:linear-gradient(135deg,#ff1738,#b90024);padding:10px 14px;border:1px solid #ff6678;border-radius:11px;font:800 11px Inter,system-ui,sans-serif;box-shadow:0 10px 25px #ff17383b;">RESEARCH DASHBOARD ↗</a>'
              if marker not in s:
                  raise SystemExit('Portfolio header marker not found')
              s = s.replace(marker, link + marker, 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Dashboard link already present')

      - name: Commit dashboard link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add research dashboard link to portfolio"
            git push
          fi
