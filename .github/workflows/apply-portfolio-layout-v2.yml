name: Apply Corrected Portfolio Layout

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: portfolio-index-writes
  cancel-in-progress: false

jobs:
  update-layout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair portfolio interactions
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('onclick="..."', 'onclick="toggleMenu()"')

          # Remove the legacy duplicate script that overrides the real panel logic.
          legacy = re.compile(
              r'<script>\s*function openPanel\(id\)\{const el=document\.getElementById\(id\);.*?\n</script>',
              re.S,
          )
          s = legacy.sub('', s)

          # Remove any duplicate generated interaction script blocks, then keep one canonical block.
          blocks = re.findall(r'<script>\s*function toggleMenu\(\).*?</script>', s, re.S)
          if len(blocks) > 1:
              first = blocks[0]
              s = s.replace(''.join(blocks[1:]), '', 1)

          script = '''<script>
          const panels=[...document.querySelectorAll('.panel')];
          const menu=document.getElementById('sideMenu');
          const toggle=document.getElementById('menuToggle');
          const backdrop=document.getElementById('menuBackdrop');
          function toggleMenu(){
            if(!menu||!toggle)return;
            const open=!menu.classList.contains('open');
            menu.classList.toggle('open',open);
            if(backdrop)backdrop.classList.toggle('open',open);
            toggle.classList.toggle('open',open);
            toggle.setAttribute('aria-expanded',String(open));
            toggle.setAttribute('aria-label',open?'Close portfolio menu':'Open portfolio menu');
          }
          function closeMenu(){
            if(menu)menu.classList.remove('open');
            if(backdrop)backdrop.classList.remove('open');
            if(toggle){toggle.classList.remove('open');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Open portfolio menu');}
          }
          function openPanel(id){
            const panel=document.getElementById(id);
            if(!panel)return;
            panels.forEach(item=>item.classList.add('hidden'));
            panel.classList.remove('hidden');
            panel.classList.remove('fade');
            void panel.offsetWidth;
            panel.classList.add('fade');
            document.querySelectorAll('.side button').forEach(button=>button.classList.toggle('active',button.getAttribute('onclick').includes(id)));
            closeMenu();
            setTimeout(()=>panel.scrollIntoView({behavior:'smooth',block:'start'}),30);
          }
          function closePanel(){
            panels.forEach(panel=>panel.classList.add('hidden'));
            document.querySelectorAll('.side button').forEach(button=>button.classList.remove('active'));
            closeMenu();
            window.scrollTo({top:0,behavior:'smooth'});
          }
          document.addEventListener('DOMContentLoaded',()=>{
            if(backdrop)backdrop.addEventListener('click',closeMenu);
            if(menu)menu.querySelectorAll('button').forEach(button=>button.addEventListener('click',closeMenu));
            document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMenu();});
          });
          </script>
          '''

          # Replace the existing interaction scripts with the canonical block.
          s = re.sub(r'<script>\s*const panels=.*?</script>\s*', '', s, count=1, flags=re.S)
          s = re.sub(r'<script>\s*function toggleMenu\(\).*?</script>\s*', '', s, count=1, flags=re.S)
          s = s.replace('</body>', script + '</body>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Improve MONDAY mobile navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path('monday.html')
          s = p.read_text(encoding='utf-8')
          mobile_css = '''
          .mobile-menu{display:none;width:42px;height:42px;border:1px solid #ff5268;background:#101010;color:#fff;border-radius:12px;cursor:pointer;font-size:18px}.mobile-backdrop{display:none;position:fixed;inset:0;background:#0009;z-index:90}.mobile-backdrop.open{display:block}.mobile-menu.open{background:linear-gradient(135deg,var(--red),var(--red2))}
          @media(max-width:780px){.mobile-menu{display:block}.sidebar{position:fixed;left:0;top:0;bottom:0;width:min(300px,88vw);z-index:100;transform:translateX(-105%);transition:transform .25s ease;box-shadow:25px 0 70px #000d}.sidebar.mobile-open{transform:translateX(0)}.header{position:relative;z-index:110}.header-title{min-width:0}.badge{display:none}.composer{z-index:80}}
          '''
          if '.mobile-menu{' not in s:
              s=s.replace('</style>',mobile_css+'</style>',1)
          button='<button class="mobile-menu" id="mobileMenu" aria-label="Open MONDAY menu" aria-expanded="false" onclick="toggleMobileMenu()">☰</button>'
          if 'id="mobileMenu"' not in s:
              s=s.replace('<div class="header-title"><span class="orb"></span><strong>MONDAY</strong></div>', '<div class="header-title"><span class="orb"></span><strong>MONDAY</strong></div>'+button,1)
          if 'id="mobileBackdrop"' not in s:
              s=s.replace('<main class="main">', '<div class="mobile-backdrop" id="mobileBackdrop" onclick="closeMobileMenu()"></div><main class="main">',1)
          mobile_js='''
          function toggleMobileMenu(){const sidebar=document.querySelector('.sidebar');const button=document.getElementById('mobileMenu');const backdrop=document.getElementById('mobileBackdrop');const open=!sidebar.classList.contains('mobile-open');sidebar.classList.toggle('mobile-open',open);backdrop.classList.toggle('open',open);button.classList.toggle('open',open);button.setAttribute('aria-expanded',String(open));button.setAttribute('aria-label',open?'Close MONDAY menu':'Open MONDAY menu')}
          function closeMobileMenu(){const sidebar=document.querySelector('.sidebar');const button=document.getElementById('mobileMenu');const backdrop=document.getElementById('mobileBackdrop');sidebar.classList.remove('mobile-open');backdrop.classList.remove('open');button.classList.remove('open');button.setAttribute('aria-expanded','false');button.setAttribute('aria-label','Open MONDAY menu')}
          document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMobileMenu()});
          '''
          if 'function toggleMobileMenu()' not in s:
              s=s.replace('</script>',mobile_js+'</script>',1)
          p.write_text(s,encoding='utf-8')

      - name: Verify repairs
        shell: python
        run: |
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          monday=Path('monday.html').read_text(encoding='utf-8')
          assert 'onclick="..."' not in index
          assert index.count('function toggleMenu(){') == 1
          assert index.count('function openPanel(id){') == 1
          assert index.count('function closePanel(){') == 1
          assert 'id="menuToggle"' in index and 'id="sideMenu"' in index
          assert 'href="dashboard.html"' in index
          assert 'id="mobileMenu"' in monday
          assert 'function toggleMobileMenu()' in monday
          assert 'mobile-open' in monday
          print('Portfolio and MONDAY interaction verification passed.')

      - name: Commit repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html monday.html
          if git diff --cached --quiet; then
            echo 'No repairs needed.'
          else
            git commit -m 'Fix portfolio menu interaction overrides'
            git push
          fi
