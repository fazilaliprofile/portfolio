name: Apply Portfolio Layout Update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-layout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply premium visual layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''
          /* Premium editorial visual layer */
          body{background:radial-gradient(circle at 82% 8%,#ff17382b,transparent 24%),radial-gradient(circle at 10% 55%,#ff17380d,transparent 30%),linear-gradient(180deg,#020202 0%,#080808 48%,#020202 100%)}
          body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at 50% 20%,transparent 0 35%,#0009 100%)}
          .top{border-color:#ffffff16;background:linear-gradient(135deg,#111111e8,#050505d9);box-shadow:0 20px 70px #000b,0 0 35px #ff17380d}
          .menu-toggle{border-color:#ff5268;background:linear-gradient(145deg,#161616f5,#070707e8);box-shadow:0 15px 45px #000d,0 0 28px #ff17381c}
          .side{border-color:#ff52684d;background:linear-gradient(145deg,#151515f5,#050505f4);box-shadow:0 30px 90px #000e,0 0 40px #ff173814}
          .hero{padding-top:120px}
          .hero-grid{gap:90px}
          .hero h1{font-size:clamp(58px,9vw,118px);text-shadow:0 0 70px #ff17382e;letter-spacing:-.085em}
          .hero h2{font-weight:850;max-width:720px}
          .hero p{font-size:18px;max-width:620px}
          .eyebrow{font-size:11px;letter-spacing:.24em}
          .actions{margin-top:32px}
          .btn{border-radius:14px;padding:14px 20px}
          .dashboard{border-color:#ffffff16;border-radius:30px;background:linear-gradient(145deg,#1a1a1ae8,#060606f2);box-shadow:0 40px 120px #000e,0 0 90px #ff17381b}
          .chart{border-color:#ffffff12;background:linear-gradient(180deg,#181818,#050505);box-shadow:inset 0 1px #ffffff08}
          .panel{padding-top:105px}
          .panel-inner{width:min(1120px,92%)}
          .panel-head{margin-bottom:42px}
          .panel-head h2{font-size:clamp(40px,6vw,68px);letter-spacing:-.055em}
          .card{border-color:#ffffff12;border-radius:24px;padding:28px;background:linear-gradient(145deg,#151515,#080808);box-shadow:0 25px 80px #000b,inset 0 1px #ffffff08;transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease}
          .card:hover{transform:translateY(-5px);border-color:#ff17384d;box-shadow:0 30px 90px #000d,0 0 35px #ff173812}
          .tag{border-radius:999px;padding:8px 12px;background:linear-gradient(135deg,#ff17381c,#ff173808);border-color:#ff173833}
          .project{min-height:320px}
          .timeline{border-left-width:3px}
          .footer{margin-top:60px;border-top-color:#ffffff12}
          @media(max-width:850px){.hero-grid{gap:45px}.hero{padding-top:130px}.hero h1{font-size:clamp(52px,14vw,82px)}}
          @media(max-width:600px){.hero{padding-top:120px}.hero h1{font-size:54px}.card{padding:22px}}
          '''
          if 'Premium editorial visual layer' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit premium layout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No premium styling changes needed.'
          else
            git commit -m 'Apply premium editorial portfolio styling'
            git push
          fi
